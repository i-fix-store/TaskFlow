<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskFlow Admin</title>
<style>*{box-sizing:border-box}body{font-family:system-ui,Cairo,sans-serif;background:#060a08;color:#e8f4ec;margin:0;padding:16px;max-width:760px;margin:auto}
.c{background:#0e1612;border:1px solid #1f3328;border-radius:14px;padding:14px;margin-bottom:12px}input,textarea,select{width:100%;background:#0a110d;color:inherit;border:1px solid #1f3328;border-radius:10px;padding:8px;margin:4px 0;font:inherit}
button{background:#15211a;color:#e8f4ec;border:1px solid #1f3328;border-radius:10px;padding:8px 14px;cursor:pointer;font:inherit}button.p{background:#39ff88;color:#032010;font-weight:800;border:0}
.m{color:#82988c;font-size:13px}.u{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid #16241c}.u.on{color:#39ff88}</style></head><body>
<h2>TaskFlow Admin</h2><div id="o"></div>
<script type="module">
const CFG={apiKey:"AIzaSyCcRJIg8ZYiBgLueHlHOiW_w2tMwDVDt-U",authDomain:"taskflow-lifeos-fc087.firebaseapp.com",projectId:"taskflow-lifeos-fc087",storageBucket:"taskflow-lifeos-fc087.firebasestorage.app",messagingSenderId:"642614537193",appId:"1:642614537193:web:9d2979d96342eb5feb7978"};
const B='https://www.gstatic.com/firebasejs/13.4.0/',[A,AU,FS]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js'),import(B+'firebase-firestore.js')]);
const app=A.initializeApp(CFG),auth=AU.getAuth(app),db=FS.getFirestore(app),$=s=>document.querySelector(s),O=$('#o');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let sel=null,users=[];const L=k=>localStorage['tfa.'+k]||'';
AU.onAuthStateChanged(auth,async u=>{if(!u)return login();
 try{const a=await FS.getDoc(FS.doc(db,'admins',u.uid));if(!a.exists())return O.innerHTML=`<div class="c">الحساب ده مش أدمن.<br>انسخ الـ UID ده وضيفه في Firestore: collection <b>admins</b> ← document id = UID<br><input dir="ltr" readonly value="${u.uid}" onclick="this.select()"></div>`;
 const s=await FS.getDocs(FS.collection(db,'profiles'));users=s.docs.map(d=>({uid:d.id,...d.data()}));main()}catch(e){O.innerHTML='<div class="c">خطأ: '+esc(e.code||e.message)+'</div>'}});
function login(){O.innerHTML=`<div class="c"><button class="p" id="g">دخول بجوجل</button><input id="e" dir="ltr" placeholder="الإيميل"><input id="p" type="password" dir="ltr" placeholder="كلمة السر"><button id="l">دخول</button> <span class="m" id="er"></span></div>`;
 $('#g').onclick=()=>AU.signInWithPopup(auth,new AU.GoogleAuthProvider()).catch(e=>$('#er').textContent=e.code);
 $('#l').onclick=()=>AU.signInWithEmailAndPassword(auth,$('#e').value.trim(),$('#p').value).catch(e=>$('#er').textContent=e.code)}
function main(){O.innerHTML=`<div class="c"><b>المستخدمين (${users.length})</b><div class="m">اللي فعّلوا "السماح بجداول مقترحة" بس بيظهروا هنا.</div>${users.map(u=>`<div class="u ${sel==u.uid?'on':''}"><span dir="ltr">${esc(u.email)} ${u.name?'· '+esc(u.name):''}</span><button data-u="${u.uid}">اختيار</button></div>`).join('')||'<div class="m">لسه مفيش حد.</div>'}</div>
<div class="c"><b>الذكاء الاصطناعي</b><div class="m">المفتاح بيتحفظ في متصفحك إنت بس. الأفضل رابط Worker.</div><input id="w" dir="ltr" placeholder="رابط Worker (اختياري)" value="${esc(L('w'))}"><input id="k" type="password" dir="ltr" placeholder="مفتاح Gemini (اختياري)" value="${esc(L('k'))}"></div>
<div class="c"><b>${sel?'الجدول لـ '+esc(users.find(u=>u.uid==sel)?.email):'اختار مستخدم الأول'}</b><textarea id="b" rows="5" placeholder="اوصف وضع الشخص: شغله، حصصه، مواده، وقت فاضيه..."></textarea><button id="gen">ولّد بالذكاء الاصطناعي</button> <span class="m" id="st"></span>
<textarea id="t" rows="10" dir="ltr" placeholder='{"tasks":[{"t":"فيزياء","date":"2026-11-23","time":"10:00","dur":90,"pri":"high","cat":"مذاكرة","rep":"w"}]}'></textarea><input id="n" placeholder="ملاحظة للمستخدم (اختياري)"><button class="p" id="s">إرسال كمقترح</button></div>`;
 O.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{sel=b.dataset.u;keep();main()});$('#gen').onclick=gen;$('#s').onclick=send;$('#w').onchange=$('#k').onchange=keep}
function keep(){if($('#w'))localStorage['tfa.w']=$('#w').value.trim(),localStorage['tfa.k']=$('#k').value.trim()}
const SYS=()=>`You are a study/work planner for an Egyptian student. Today is ${new Date().toLocaleDateString('sv')}. Return ONLY JSON {"tasks":[{"t":string(Arabic),"date":"YYYY-MM-DD","time":"HH:MM","dur":minutes,"pri":"low|mid|high","cat":string,"rep":""|"d"|"w"|"m","note":string}]}. No overlaps, respect fixed commitments, plan the next 7 days, max 30 tasks.`;
async function gen(){keep();const b=$('#b').value.trim(),st=$('#st');if(!b)return st.textContent='اكتب الوصف';st.textContent='بيفكر...';
 try{let j;if(L('k')){const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':L('k')},body:JSON.stringify({systemInstruction:{parts:[{text:SYS()}]},contents:[{role:'user',parts:[{text:b}]}],generationConfig:{responseMimeType:'application/json'}})});if(!r.ok)throw new Error('Gemini '+r.status);const d=await r.json();j=JSON.parse(d.candidates[0].content.parts.map(p=>p.text||'').join(''))}
 else if(L('w')){const r=await fetch(L('w'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[{role:'user',content:b}],ctx:{}})});if(!r.ok)throw new Error('Worker '+r.status);j=await r.json()}else throw new Error('حط مفتاح أو رابط Worker');
 const tasks=j.plan?.tasks||j.tasks;if(!tasks?.length)throw new Error('مفيش جدول في الرد');$('#t').value=JSON.stringify({tasks},null,1);st.textContent='راجعه وعدّل قبل الإرسال'}catch(e){st.textContent=e.message}}
async function send(){const st=$('#st');if(!sel)return st.textContent='اختار مستخدم';let tasks;try{tasks=JSON.parse($('#t').value).tasks;if(!Array.isArray(tasks)||!tasks.length)throw 0}catch{return st.textContent='JSON غير صالح'}
 tasks=tasks.slice(0,60).map(t=>({t:String(t.t||'').slice(0,120),date:String(t.date||''),time:String(t.time||''),dur:+t.dur||30,pri:['low','mid','high'].includes(t.pri)?t.pri:'mid',cat:String(t.cat||'').slice(0,30),rep:['d','w','m'].includes(t.rep)?t.rep:'',note:String(t.note||'').slice(0,300)})).filter(t=>t.t&&/^\d{4}-\d\d-\d\d$/.test(t.date));
 try{await FS.addDoc(FS.collection(db,'proposals',sel,'items'),{tasks,note:$('#n').value.slice(0,300),status:'pending',createdAt:Date.now()});st.textContent='اتبعت ✓ بيظهر عنده كمقترح وهو اللي يقبل'}catch(e){st.textContent=e.code=='permission-denied'?'المستخدم مش مفعّل السماح، أو القواعد ناقصة':e.code||e.message}}
</script></body></html>
